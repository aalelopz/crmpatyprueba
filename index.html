 return Math.ceil((((x-y)/86400000)+1)/7);
}

 rows.push({type:"Comercio",day:c.day,week:c.week,branch:String(c.branch),emp:String(c.emp),advisor:c.advisor,

 newCount:nw.reduce((s,a)=>s+(Array.isArray(a)?a.length:0),0),newAmt:nw.reduce((s,a)=>s+sumArr(a),0),
 inaCount:ina.reduce((s,a)=>s+(Array.isArray(a)?a.length:0),0),inaAmt:ina.reduce((s,a)=>s+sumArr(a),0),

function visualBranchChart(rows,kind){
 let groups={};rows.filter(r=>r.type===kind).forEach(r=>{if(!groups[r.branch])groups[r.branch]=[];groups[r.branch].push(r)});
 let vals=Object.entries(groups).map(([branch,rr])=>{let s=dashAgg(rr);return {branch,value:kind==="Comercio"?safePct(s.srv,s.req):safePct(s.tazA,s.tazD)}}).sort((a,b)=>b.value-a.value);
 if(!vals.length)return '<p class="dashnote">Sin datos para graficar.</p>';
 return vals.map(x=>`<div class="barrow"><b>${x.branch}</b><div class="bartrack"><div class="barfill" style="width:${Math.min(100,x.value)}%"></div></div><span>${x.value.toFixed(1)}%</span></div>`).join("");
}
function visualDailyTrend(rows){
 let groups={};rows.forEach(r=>{if(!groups[r.day])groups[r.day]=[];groups[r.day].push(r)});
 let vals=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).map(([day,rr])=>{let s=dashAgg(rr);return {day,value:s.newAmt+s.inaAmt+s.vdaNew+s.vdaRep+s.vdaCash+s.funds+s.guardAmt+s.somosAmt+s.invAmt}});
 let max=Math.max(1,...vals.map(x=>x.value));
 if(!vals.length)return '<p class="dashnote">Sin datos para graficar.</p>';
 return `<div class="trendbars">${vals.map(x=>`<div class="trendcol" title="${money(x.value)}"><div class="trendbar" style="height:${Math.max(3,x.value/max*150)}px"></div><small>${x.day.slice(5)}</small></div>`).join("")}</div><div class="dashnote" style="margin-top:8px">Monto combinado capturado por día (Banco + Comercio) para visualizar tendencia.</div>`;
}
function pieCard(title,sub,items){
 let clean=items.map((x,i)=>({name:x[0],value:Number(x[1])||0,color:["#28765b","#e3b341","#c94747","#447a9c"][i%4]}));
 let total=clean.reduce((s,x)=>s+x.value,0);if(total<=0)return `<div class="chartcard"><h3>${title}</h3><div class="chartsub">${sub}</div><p class="dashnote">Sin datos para graficar.</p></div>`;
 let deg=0,stops=[];clean.forEach(x=>{let a=deg,b=deg+(x.value/total*360);stops.push(`${x.color} ${a}deg ${b}deg`);deg=b});
 return `<div class="chartcard"><h3>${title}</h3><div class="chartsub">${sub}</div><div class="piebox"><div class="donut" style="background:conic-gradient(${stops.join(",")})"></div><div>${clean.map(x=>`<div class="legendrow"><span class="legenddot" style="background:${x.color}"></span><span>${x.name}: <b>${money(x.value)}</b> · ${(x.value/total*100).toFixed(1)}%</span></div>`).join("")}</div></div></div>`;
}
function countPieCard(title,sub,items){

 if(total<=0)return `<div class="chartcard"><h3>${title}</h3><div class="chartsub">${sub}</div><p class="dashnote">Sin datos para graficar.</p></div>`;
 let deg=0,stops=[];clean.forEach(x=>{let a=deg,b=deg+x.value/total*360;stops.push(`${x.color} ${a}deg ${b}deg`);deg=b});
 return `<div class="chartcard"><h3>${title}</h3><div class="chartsub">${sub}</div><div class="piebox"><div class="donut" style="background:conic-gradient(${stops.join(",")})"></div><div>${clean.map(x=>`<div class="legendrow"><span class="legenddot" style="background:${x.color}"></span><span>${x.name}: <b>${x.value}</b> · ${(x.value/total*100).toFixed(1)}%</span></div>`).join("")}</div></div></div>`;

}
function placeholder(title,sub,icon,msg){topTitle.textContent=title;view.innerHTML=`<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div></div><div class="card placeholder"><div><div class="icon">${icon}</div><h2>${title}</h2><p>${msg}</p></div></div>`}
function renderAdvisors(){topTitle.textContent="Alta de asesores";view.innerHTML=`<div class="pagehead"><div><span class="sectionmark">GRUPO ELEKTRA · BANCO AZTECA</span><h1>Alta de asesores</h1><p>Administra los asesores de las 11 sucursales de la región. <b><span id="advisorCount"></span> asesores cargados.</b></p></div><button class="btn primary" onclick="openModal()">+ Nuevo asesor</button></div><div class="card"><div class="filters"><input id="q" placeholder="Buscar por nombre o número de empleado" oninput="drawRows()"><select id="fb" onchange="drawRows()"><option value="">Todas las sucursales</option>${branches.map(x=>`<option>${x}</option>`).join("")}</select><select id="fs" onchange="drawRows()"><option value="">Todas las actividades</option><option>Activo</option><option>Vacaciones</option><option>Incapacidad</option></select></div><div id="rows"></div></div>`;document.getElementById("advisorCount").textContent=advisors.filter(x=>x.status!=="Baja").length;drawRows()}
function drawRows(){let q=(document.getElementById("q")?.value||"").toLowerCase(),fb=document.getElementById("fb")?.value||"",fs=document.getElementById("fs")?.value||"";let a=advisors.filter(x=>x.status!=="Baja"&&(x.name.toLowerCase().includes(q)||x.emp.includes(q))&&(!fb||x.branch===fb)&&(!fs||x.status===fs));document.getElementById("rows").innerHTML=a.length?`<table><thead><tr><th>N.º empleado</th><th>Nombre</th><th>Sucursal</th><th>Actividad</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.emp)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.branch)}</td><td><span class="badge ${x.status.toLowerCase()}">${x.status}</span></td><td><button class="linkbtn" onclick="openModal('${esc(x.emp)}')">Editar</button></td></tr>`).join("")}</tbody></table>`:`<div style="padding:36px;text-align:center;color:#6f7b91">No hay asesores para mostrar. Usa <b>+ Nuevo asesor</b> para comenzar.</div>`}
function deactivateAdvisor(emp){
 const a=advisors.find(x=>x.emp===emp); if(!a)return;
 if(!confirm(`¿Dar de baja a ${a.name}?\n\nEl asesor dejará de estar disponible para nuevas capturas. Su información e historial se conservarán.`))return;
 a.status="Baja"; a.deactivated_at=new Date().toISOString(); a.deactivated_by="Administrador"; a.updated_at=new Date().toISOString();
 localStorage.setItem("crm_advisors",JSON.stringify(advisors)); drawRows();
}
function reactivateAdvisor(emp){
 const a=advisors.find(x=>x.emp===emp); if(!a)return;
 if(!confirm(`¿Reactivar a ${a.name}?\n\nSu actividad volverá a Activo.`))return;
 a.status="Activo"; a.reactivated_at=new Date().toISOString(); a.reactivated_by="Administrador"; a.updated_at=new Date().toISOString();
 localStorage.setItem("crm_advisors",JSON.stringify(advisors)); drawRows();
}
function openModal(emp){editing=emp||null;document.getElementById("branch").innerHTML=branches.map(x=>`<option>${x}</option>`).join("");document.getElementById("modalTitle").textContent=editing?"Editar asesor":"Nuevo asesor";let a=advisors.find(x=>x.emp===editing);document.getElementById("emp").value=a?.emp||"";document.getElementById("name").value=a?.name||"";document.getElementById("branch").value=a?.branch||branches[0];document.getElementById("status").value=a?.status||"Activo";document.getElementById("error").textContent="";document.getElementById("modalbg").classList.add("open")}
function closeModal(){document.getElementById("modalbg").classList.remove("open")}
function saveAdvisor(){let emp=document.getElementById("emp").value.trim(),name=document.getElementById("name").value.trim(),branch=document.getElementById("branch").value,status=document.getElementById("status").value,err=document.getElementById("error");if(!/^\d+$/.test(emp)||!name){err.textContent="Captura un número de empleado válido y el nombre completo.";return}if(advisors.some(x=>x.emp===emp&&x.emp!==editing)){err.textContent="Ese número de empleado ya está registrado.";return}if(editing){let i=advisors.findIndex(x=>x.emp===editing);advisors[i]={...advisors[i],emp,name,branch,status,updated_at:new Date().toISOString()}}else advisors.push({emp,name,branch,status,created_at:new Date().toISOString(),updated_at:new Date().toISOString()});localStorage.setItem("crm_advisors",JSON.stringify(advisors));closeModal();renderAdvisors()}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>nav(b.dataset.page));nav("asesores");
</script>
</body></html>
