<script>

// Edita únicamente los valores de este bloque para ajustar metas

// ============================================================
// ============================================================
// METAS — mínimos semanales de productividad por control ("MUDO" =

// al ideal; "Ideal" = meta cumplida). Edita únicamente los valores de
// este bloque para ajustar metas o textos de acción sugerida.
// ============================================================
const TASA_ACTIVACION_MIN=0.6;
const METAS={
 DIAS_OPERACION:7,
 DIAS_SIN_CAPTURA_ALERTA:2,
 BANCO:{

  guard:{ideal:10,montoComision:500},
  somos:{ideal:4,montoComision:3000},
  inv:{ideal:2},
  taz:{idealMin:3}
 },

};
// ============================================================
// META_SUCURSAL: cuotas fijas por sucursal para Afiliaciones,

function isoYear(d=new Date()){
 const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
 const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);
 return x.getUTCFullYear();
}
function weekKeyOf(d=new Date()){return `${isoYear(d)}-${String(isoWeek(d)).padStart(2,"0")}`}
function weekMondayOf(d=new Date()){let day=d.getDay()||7;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-(day-1))}
function weekRangeOf(wk){
 let [y,w]=wk.split("-").map(Number);
 let jan4=new Date(y,0,4),mondayWeek1=weekMondayOf(jan4);
 let monday=new Date(mondayWeek1);monday.setDate(monday.getDate()+(w-1)*7);
 let sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);
 return {monday,sunday};
}
function weekDaysOf(wk){let {monday}=weekRangeOf(wk);return Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);return d})}
function isCurrentWeek(wk){return wk===weekKeyOf(new Date())}
function lastNWeekKeys(n){let keys=[],d=new Date();for(let i=0;i<n;i++){keys.unshift(weekKeyOf(d));d.setDate(d.getDate()-7)}return keys}
const MESES_ABBR=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function weekLabel(wk){
 let {monday,sunday}=weekRangeOf(wk),w=Number(wk.split("-")[1]);
 let range=monday.getMonth()===sunday.getMonth()?`${monday.getDate()}-${sunday.getDate()} ${MESES_ABBR[monday.getMonth()]}`:`${monday.getDate()} ${MESES_ABBR[monday.getMonth()]}-${sunday.getDate()} ${MESES_ABBR[sunday.getMonth()]}`;
 return `Sem ${w} · ${range}`;
}

function controlResult(ctrl,sums,ctx){
 if(ctrl.special==="taz"){
  let d=sums.tazDelivered||0,a=sums.tazActivated||0,state=evalTaz(d,a,ctrl.idealMin);
  let tasa=d>0?a/d:null;
  let faltante=state==="IDEAL"?"":state==="MUDO"?(d<=0?"Falta al menos 1 TAZ entregada":"Falta al menos 1 TAZ activada"):`Faltan para llegar a ${ctrl.idealMin} entregadas y ${ctrl.idealMin} activadas`;
  let progressPct=Math.max(0,Math.min(100,Math.round(Math.min(d,a)/ctrl.idealMin*100)));
  return {key:ctrl.key,label:ctrl.label,icon:ctrl.icon,state,actualLabel:`${d} entreg. / ${a} activ.`,minLabel:`≥${ctrl.idealMin}/≥${ctrl.idealMin}`,faltante,progressPct,tazDelivered:d,tazActivated:a,tasaActivacion:tasa};
 }
 if(ctrl.special==="regional"){
  let sum=ctrl.getSum(sums)||0,isMoney=ctrl.valueKind==="money";
  let meta=ctx&&ctx[ctrl.regionalKey]!=null?ctx[ctrl.regionalKey]:null;
  if(meta==null){
   return {key:ctrl.key,label:ctrl.label,icon:ctrl.icon,state:"SIN_META",actualLabel:isMoney?money(sum):String(sum),minLabel:"—",faltante:"Sin meta asignada este trimestre",progressPct:0,metaIndividual:null};
  }
  let state=evalTwoThreshold(sum,1,meta);
  let metaR=isMoney?Math.round(meta):Math.round(meta*10)/10,diff=Math.max(0,Math.ceil(meta-sum));
  let faltante=state==="IDEAL"?"":isMoney?`Faltan ${money(meta-sum)} para tu meta de ${money(metaR)}`:`Falta${diff===1?"":"n"} ${diff} ${diff===1?ctrl.singular:ctrl.label.toLowerCase()} para tu meta de ${metaR}`;
  let progressPct=Math.max(0,Math.min(100,Math.round(sum/Math.max(0.0001,meta)*100)));
  return {key:ctrl.key,label:ctrl.label,icon:ctrl.icon,state,actualLabel:isMoney?money(sum):String(sum),minLabel:isMoney?money(metaR):String(metaR),faltante,progressPct,metaIndividual:metaR};
 }
 let raw=ctrl.getAmounts?ctrl.getAmounts(sums).length:(ctrl.getSum(sums)||0);
 let state=evalTwoThreshold(raw,ctrl.mudoBelow,ctrl.idealAt);
 let isMoney=ctrl.valueKind==="money";
 let display=isMoney?money(raw):String(raw);
 let idealDisplay=isMoney?money(ctrl.idealAt):String(ctrl.idealAt);
 let diff=Math.max(0,ctrl.idealAt-raw);
 let unitPlural=ctrl.unitPlural||ctrl.label.toLowerCase();
 let faltante;
 if(state==="IDEAL")faltante="";
 else if(isMoney)faltante=state==="MUDO"?`Falta monto en ${ctrl.label}`:`Faltan ${money(ctrl.idealAt-raw)} para Ideal`;
 else faltante=`Falta${diff===1?"":"n"} ${diff} ${diff===1?(ctrl.unit||unitPlural):unitPlural} para Ideal (${ctrl.idealAt})`;
 let progressPct=Math.max(0,Math.min(100,Math.round(raw/Math.max(1,ctrl.idealAt)*100)));
 let extra={};
 if(ctrl.getAmounts&&ctrl.montoComision)extra.belowComision=ctrl.getAmounts(sums).filter(x=>x<ctrl.montoComision).length;
 if(ctrl.rubroCriticoFlag)extra.rubroCriticoFlag=true;
 return {key:ctrl.key,label:ctrl.label,icon:ctrl.icon,state,actualLabel:display,minLabel:idealDisplay,faltante,progressPct,...extra};
}
function sumBankWeek(emp,bn,wk){
 let s={aff:0,port:0,funds:0,guardAmounts:[],somosAmounts:[],invAmounts:[],cashAmounts:[],tazDelivered:0,tazActivated:0};
 bankCaptures.filter(c=>c.emp===emp&&c.branch===bn&&weekKeyOf(dateFromKey(c.day))===wk).forEach(c=>{
  let d=c.data||{};
  s.aff+=Number(d.aff)||0;s.port+=Number(d.port)||0;s.funds+=Number(d.funds)||0;
  s.guardAmounts.push(...(d.guardAmounts||[]));s.somosAmounts.push(...(d.somosAmounts||[]));s.invAmounts.push(...(d.invAmounts||[]));
  s.cashAmounts.push(...(d.cashAmounts||[]));
  s.tazDelivered+=Number(d.tazDelivered)||0;s.tazActivated+=Number(d.tazActivated)||0;
 });
 return s;
}
function sumCommerceWeek(emp,bn,wk){

  let d=c.data||{};

   s.nw[i].push(...((d.nw||[[],[],[]])[i]||[]));s.ina[i].push(...((d.ina||[[],[],[]])[i]||[]));s.vda[i].push(...((d.vda||[[],[],[]])[i]||[]));

function evaluarAsesorSemana(advisor,formType,wk){

 if(formType==="Banco"){
  let frozen=getFrozenMetaIndividual(advisor.id,bn);

 }
 let controles=(formType==="Banco"?CONTROLES_BANCO:CONTROLES_COMERCIO).map(c=>controlResult(c,sums,ctx));
 let evaluados=controles.filter(c=>c.state!=="SIN_META");
 let mudos=evaluados.filter(c=>c.state==="MUDO").length,parciales=evaluados.filter(c=>c.state==="PARCIAL").length,ideales=evaluados.filter(c=>c.state==="IDEAL").length,total=evaluados.length;

 let tazCtrl=controles.find(c=>c.key==="taz");
 return {advisor,formType,week:wk,controles,mudos,parciales,ideales,total,enCurso,estatus,mudoGeneral:mudos>0,
  cumplimientoPct:total?Math.round(ideales/total*100):0,coberturaPct:total?Math.round((total-mudos)/total*100):0,
  tasaActivacionTaz:tazCtrl?tazCtrl.tasaActivacion:null,

}
function weekDaysElapsed(wk){
 if(!isCurrentWeek(wk))return METAS.DIAS_OPERACION;
 let {monday}=weekRangeOf(wk),hoy=dateFromKey(dayKey(new Date()));
 return Math.max(1,Math.min(METAS.DIAS_OPERACION,Math.floor((hoy-monday)/86400000)+1));
}
function constanciaAsesorSemana(advisor,formType,wk){

  ?bankCaptures.filter(c=>c.emp===advisor.emp&&c.branch===bn&&weekKeyOf(dateFromKey(c.day))===wk)
  :commerceCaptures.filter(c=>c.emp===advisor.emp&&c.branch===bn&&c.status!=="correction_rejected"&&weekKeyOf(dateFromKey(c.day))===wk);
 let diasConCaptura=new Set(caps.map(c=>c.day));
 let diasBase=weekDaysElapsed(wk),diasSinCaptura=Math.max(0,diasBase-diasConCaptura.size);
 let dayFlags=weekDaysOf(wk).map(d=>({date:dayKey(d),dow:d.getDay(),captured:diasConCaptura.has(dayKey(d))}));
 return {diasConCaptura:diasConCaptura.size,diasBase,diasSinCaptura,focoRojo:diasSinCaptura>=METAS.DIAS_SIN_CAPTURA_ALERTA,
  pct:diasBase?Math.round(diasConCaptura.size/diasBase*100):0,dayFlags};
}

function persistenciaControlFromMatrix(matrix,advisor,formType,key,fromWeek,weeks6){
 let idx=weeks6.indexOf(fromWeek),start=idx;
 if(weeks6[start]===weekKeyOf(new Date()))start--;
 let streak=0;
 for(let i=start;i>=0;i--){
  let e=matrix[advisor.id]&&matrix[advisor.id][weeks6[i]];
  let c=e&&e.controles.find(x=>x.key===key);
  if(c&&c.state==="MUDO")streak++;else break;
 }
 return streak;
}
function rubroCritico(evals,formType){

 let stats=ctrls.map(c=>{
  let states=evals.map(e=>e.controles.find(x=>x.key===c.key).state);
  let mudos=states.filter(s=>s==="MUDO").length,idealN=states.filter(s=>s==="IDEAL").length;
  return {key:c.key,label:c.label,mudos,pctIdeal:states.length?idealN/states.length*100:0};
 });
 stats.sort((a,b)=>b.mudos-a.mudos||a.pctIdeal-b.pctIdeal);
 return stats[0]&&stats[0].mudos>0?stats[0]:null;
}

// ---- Generación de datos DEMO (deterministas por número de empleado) ----
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*131+s.charCodeAt(i))>>>0;return h}
function makeRng(seedStr){let state=hashStr(seedStr)||1;return function(){state=(state*1103515245+12345)&0x7fffffff;return state}}
function splitInt(total,parts,rng){
 if(parts<=0)return[];
 if(parts===1)return[Math.max(0,total)];
 let cuts=[];for(let i=0;i<parts-1;i++)cuts.push(rng()%(total+1));
 cuts.sort((a,b)=>a-b);
 let res=[],prev=0;cuts.forEach(c=>{res.push(c-prev);prev=c});res.push(total-prev);
 return res;
}
function distributeList(list,parts,rng){
 let buckets=Array.from({length:Math.max(1,parts)},()=>[]);
 list.forEach(v=>{buckets[rng()%buckets.length].push(v)});
 return buckets;
}
function advisorProfile(emp){
 let r=hashStr(emp+"|profile")%100;
 if(r<40)return "cumplidor";if(r<70)return "parcial";if(r<90)return "ceros";return "persistente";
}
function stuckControlFor(emp,formType){
 let ctrls=formType==="Banco"?CONTROLES_BANCO:CONTROLES_COMERCIO;
 return ctrls[hashStr(emp+"|stuck|"+formType)%ctrls.length].key;
}
function decideControlStates(emp,formType,wk,profile){
 let ctrls=formType==="Banco"?CONTROLES_BANCO:CONTROLES_COMERCIO,rng=makeRng(emp+"|"+formType+"|"+wk+"|states"),states={};
 if(profile==="persistente"){let stuck=stuckControlFor(emp,formType);ctrls.forEach(c=>{states[c.key]=c.key===stuck?"MUDO":"IDEAL"});return states}
 if(profile==="cumplidor"){ctrls.forEach(c=>{states[c.key]="IDEAL"});return states}
 if(profile==="parcial"){ctrls.forEach(c=>{states[c.key]="PARCIAL"});return states}
 ctrls.forEach(c=>{states[c.key]="IDEAL"});
 let n=1+(rng()%2),idxs=new Set(),tries=0;
 while(idxs.size<n&&tries<30){idxs.add(rng()%ctrls.length);tries++}
 idxs.forEach(i=>{states[ctrls[i].key]="MUDO"});
 return states;
}
function genAmountsForState(ideal,state,rng){
 if(state==="MUDO")return [];
 if(state==="IDEAL"){let n=ideal+(rng()%2);return Array.from({length:n},()=>50+(rng()%2000))}
 let n=Math.max(1,1+(rng()%Math.max(1,ideal-1)));
 return Array.from({length:n},()=>50+(rng()%2000));
}
function genNumericForState(mudoBelow,idealAt,state,rng){
 if(state==="MUDO")return 0;
 if(state==="IDEAL")return idealAt+1+(rng()%Math.max(1,Math.round(idealAt*0.3)+1));
 let lo=mudoBelow,hi=Math.max(lo,idealAt-1);
 return lo+(rng()%Math.max(1,hi-lo+1));
}
function genTazForState(idealMin,state,rng){
 if(state==="MUDO")return {d:0,a:0};
 if(state==="IDEAL")return {d:idealMin+(rng()%3),a:idealMin+(rng()%3)};
 return {d:idealMin+(rng()%3),a:1+(rng()%Math.max(1,idealMin-1))};
}
function genControlValue(ctrl,state,emp,formType,wk,metaCtx){
 let rng=makeRng(emp+"|"+formType+"|"+wk+"|"+ctrl.key+"|val");
 if(ctrl.special==="taz")return genTazForState(ctrl.idealMin,state,rng);
 if(ctrl.special==="regional"){let meta=metaCtx?metaCtx[ctrl.regionalKey]:null;if(meta==null)return 0;return genNumericForState(1,Math.max(1,Math.round(meta)),state,rng)}
 if(ctrl.getAmounts)return genAmountsForState(ctrl.idealAt,state,rng);
 return genNumericForState(ctrl.mudoBelow,ctrl.idealAt,state,rng);
}

  return {folio,created_at,day,week:isoWeek(dateFromKey(day)),emp:String(a.emp),advisor:a.name,branch:bn,data:d,status:"confirmed",demo:true};
 }

 return {folio,created_at,day,week:isoWeek(dateFromKey(day)),emp:String(a.emp),advisor:a.name,branch:bn,data:{req,srv,nw,ina,vda,captureDate:day,totals},totals,status:"confirmed",demo:true};

function buildDemoCaptures(a,formType,wk){

 if(formType==="Comercio"){[0,1,2].forEach(i=>{values["srv_"+i]=Math.min(values["srv_"+i],values["req_"+i])})}
 let rngDays=makeRng(a.emp+"|"+formType+"|"+wk+"|days");

 let dayCountTarget=profile==="cumplidor"?5+rngDays()%3:profile==="ceros"?3+rngDays()%4:4+rngDays()%3;

 let days=weekDaysOf(wk),dayIdxs=[];for(let i=0;i<diasDisponibles;i++)dayIdxs.push(i);
 for(let i=dayIdxs.length-1;i>0;i--){let j=rngDays()%(i+1),t=dayIdxs[i];dayIdxs[i]=dayIdxs[j];dayIdxs[j]=t}
 let capturingIdxs=dayIdxs.slice(0,dayCountTarget).sort((x,y)=>x-y);
 let rngSub=makeRng(a.emp+"|"+formType+"|"+wk+"|subcount");
 let subcapsPerDay=capturingIdxs.map(()=>2+(rngSub()%2));
 let totalSub=subcapsPerDay.reduce((s,n)=>s+n,0);
 if(!totalSub)return [];
 let rngSplit=makeRng(a.emp+"|"+formType+"|"+wk+"|split");
 let perSub=Array.from({length:totalSub},()=>({}));
 ctrls.forEach(c=>{

   let t=values[c.key]||{d:0,a:0};
   splitInt(t.d,totalSub,rngSplit).forEach((p,i)=>{perSub[i].taz=perSub[i].taz||{d:0,a:0};perSub[i].taz.d=p});
   splitInt(t.a,totalSub,rngSplit).forEach((p,i)=>{perSub[i].taz=perSub[i].taz||{d:0,a:0};perSub[i].taz.a=p});

   splitInt(values[c.key]||0,totalSub,rngSplit).forEach((p,i)=>perSub[i][c.key]=p);
  }
 });
 let recs=[],subIdx=0;
 capturingIdxs.forEach((dayIdx,di)=>{
  let n=subcapsPerDay[di];
  for(let k=0;k<n;k++){recs.push(buildDemoRecord(a,formType,bn,dayKey(days[dayIdx]),8+k*3,perSub[subIdx],subIdx));subIdx++}
 });
 return recs;

function sanitizeMoneyAmount(raw){

}

function trendSvg(trend){
 let w=640,h=170,padL=34,padR=10,padT=16,padB=26,innerW=w-padL-padR,innerH=h-padT-padB,n=trend.length;
 let x=i=>padL+(n<=1?innerW/2:innerW*i/(n-1)),y=v=>padT+innerH-(v/100*innerH);
 let pathFor=key=>trend.map((t,i)=>`${i===0?"M":"L"}${x(i).toFixed(1)},${y(t[key]).toFixed(1)}`).join(" ");
 let gridLines=[0,25,50,75,100].map(v=>`<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${w-padR}" y2="${y(v).toFixed(1)}" stroke="#e0e4dc" stroke-width="1"/><text x="${padL-6}" y="${(y(v)+3).toFixed(1)}" font-size="10" fill="#697267" text-anchor="end">${v}%</text>`).join("");
 let labels=trend.map((t,i)=>`<text x="${x(i).toFixed(1)}" y="${h-6}" font-size="10" fill="#697267" text-anchor="middle">S${t.week.split("-")[1]}</text>`).join("");
 let dotsC=trend.map((t,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(t.pctSinMudos).toFixed(1)}" r="3.2" fill="#08783f"/><text x="${x(i).toFixed(1)}" y="${(y(t.pctSinMudos)-7).toFixed(1)}" font-size="10" fill="#08783f" text-anchor="middle">${t.pctSinMudos}%</text>`).join("");
 let dotsP=trend.map((t,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(t.cp).toFixed(1)}" r="3.2" fill="#315c9d"/><text x="${x(i).toFixed(1)}" y="${(y(t.cp)+14).toFixed(1)}" font-size="10" fill="#315c9d" text-anchor="middle">${t.cp}%</text>`).join("");
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Tendencia de asesores sin mudos y cumplimiento">${gridLines}${labels}<path d="${pathFor('pctSinMudos')}" fill="none" stroke="#08783f" stroke-width="2.4"/><path d="${pathFor('cp')}" fill="none" stroke="#315c9d" stroke-width="2.4" stroke-dasharray="5,3"/>${dotsC}${dotsP}</svg>
 <div class="legendrow"><span class="legenddot" style="background:#08783f"></span>% Sin mudos<span style="width:14px;display:inline-block"></span><span class="legenddot" style="background:#315c9d"></span>Cumplimiento promedio</div>`;
}

 let partsTxt=problems.map(c=>`${c.label} (${c.actualLabel}/${c.minLabel})`).join(" y ");

 let accion=mainProblem?(ACCIONES_SUGERIDAS[mainProblem.key]||"Dar seguimiento con el asesor."):"";
 let prefix=ev.estatus==="EN_AVANCE"?"Pendiente":"Falta";
 return `${advisor.name}: ${prefix.toLowerCase()} ${partsTxt}.${persistTxt} Acción: ${accion}`;

 let heatRows=heat.map(h=>{
  let cells=ctrls.map(c=>{let cr=h.eval.controles.find(x=>x.key===c.key);return `<td class="${cellClass(cr.state,h.eval.enCurso)}" title="${esc(cr.faltante||'Ideal')}">${cellIcon(cr.state,h.eval.enCurso)} ${esc(cr.actualLabel)}/${esc(cr.minLabel)}</td>`}).join("");
  return `<tr><td class="stickycol rowlink" onclick="ejecGoAdvisor('${esc(h.advisor.branch)}','${esc(h.advisor.id)}')"><b>${esc(h.advisor.name)}</b><br><small>${esc(h.advisor.emp)}</small></td>${cells}<td><b>${h.eval.cumplimientoPct}%</b></td><td>${estatusBadge(h.eval.estatus)}</td><td>${h.constancia.pct}%${h.constancia.focoRojo?" 🔴":""}</td></tr>`;
 }).join("");
 let pendientes=heat.filter(h=>h.eval.estatus!=="VERDE");
 let activacionCard=formType==="Banco"?kpiCard("Activación baja en TAZ",activacionBaja.length):"";
 let sucursalName=branch.split(" - ")[1]||branch;
 let sucursalTotals=formType==="Banco"?sucursalBankTotals(wk,allAdvisors,branchNum(branch)):null;
 let sucursalCards=sucursalTotals?(sucursalTotals.metaAff==null
  ?`${kpiCard(`Afiliaciones ${sucursalName}`,"Meta no definida")}${kpiCard(`Portabilidades ${sucursalName}`,"Meta no definida")}${kpiCard(`Efectivo ${sucursalName}`,"Meta no definida")}`
  :`${kpiCard(`Afiliaciones ${sucursalName}`,`${sucursalTotals.totalAff} de ${sucursalTotals.metaAff}`,`(${sucursalTotals.pctAff}%)`)}${kpiCard(`Portabilidades ${sucursalName}`,`${sucursalTotals.totalPort} de ${sucursalTotals.metaPort}`,`(${sucursalTotals.pctPort}%)`)}${kpiCard(`Efectivo ${sucursalName}`,`${money(sucursalTotals.totalCash)} de ${money(sucursalTotals.metaCash)}`,`(${sucursalTotals.pctCash}%)`)}`
 ):"";
 return `
 <div class="kpigrid">
  ${kpiCard("Asesores sin mudos",sinMudos.length,`(${pctSinMudos}%)`)}
  ${kpiCard("Asesores con al menos 1 mudo",conMudos.length)}
  ${kpiCard("Asesores en Ideal completo",idealCompleto.length)}
  ${kpiCard("Foco rojo de constancia",focoRojo.length)}
  ${activacionCard}
  ${sucursalCards}
 </div>
 ${rubro?`<div class="notice">🔎 <b>Rubro crítico de la sucursal:</b> ${esc(rubro.label)} — ${rubro.mudos} de ${evaluados} asesores en mudo.</div>`:""}
 ${sinPuesto.length?ejecSinPuestoNotice(sinPuesto):""}
 <div class="chartcard"><h3>Semáforo</h3>${stackedBar(evals.filter(e=>e.estatus==="VERDE").length,evals.filter(e=>e.estatus==="AMARILLO").length,evals.filter(e=>e.estatus==="ROJO").length,evals.filter(e=>e.estatus==="EN_AVANCE").length)}</div>
 <div class="chartcard"><h3>Matriz de cumplimiento por asesor</h3><div class="chartsub">Avance real / meta por control. Clic en un asesor para ver su ficha.</div>
 <div class="tablewrap heatwrap"><table><thead><tr>${heatHead}</tr></thead><tbody>${heatRows}</tbody></table></div></div>
 <div class="chartcard"><h3>📋 Indicaciones para el gerente</h3><div class="chartsub">Sucursal ${branchNum(branch)} · ${esc(weekLabel(wk))}</div>
 ${pendientes.length?`${pendientes.map(h=>{let t=ejecIndicacionTexto(h.advisor,h.eval,matrix,formType,wk,weeks6);return `<div class="indicrow"><div>${esc(t)}</div><button class="btn secondary" onclick='ejecCopyText(this,${JSON.stringify(t)})'>Copiar</button></div>`}).join("")}<div class="actions"><button class="btn primary" onclick="ejecCopyAll('${esc(branch)}','${wk}')">Copiar todo</button></div>`:`<p class="dashnote">Todos los asesores están en Ideal completo. Sin indicaciones pendientes.</p>`}
 </div>`;
}
function renderEjecAdvisorView(){
 let formType=ejec.form,wk=ejec.week,weeks6=lastNWeekKeys(6);
 let a=advisors.find(x=>x.id===ejec.advisorId);
 if(!a)return `<div class="card placeholder"><div><div class="icon">🙈</div><h2>Asesor no encontrado</h2></div></div>`;
 let matrix=ejecPrecompute(formType,weeks6,[a]);
 let ev=matrix[a.id][wk],cons=constanciaAsesorSemana(a,formType,wk);
 let progressRows=ev.controles.map(c=>{
  let pct=c.progressPct;
  let color=c.state==="IDEAL"?"#2c765d":c.state==="PARCIAL"?"#e3b341":c.state==="SIN_META"?"#b7bdb6":(ev.enCurso?"#b7bdb6":"#c94747");
  let extraBits=[];
  if(c.belowComision!=null)extraBits.push(`${c.belowComision} cuenta${c.belowComision===1?"":"s"} debajo de ${money(c.montoComision||0)} (no paga comisión)`);
  if(c.key==="taz"&&c.tasaActivacion!=null)extraBits.push(`Tasa de activación: ${Math.round(c.tasaActivacion*100)}%${c.tasaActivacion<TASA_ACTIVACION_MIN?" ⚠️ baja":""}`);
  return `<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:4px"><span>${c.icon} ${esc(c.label)}</span><span>${cellIcon(c.state,ev.enCurso)} ${esc(c.actualLabel)} / ${esc(c.minLabel)}</span></div>
  <div class="bartrack"><div class="barfill" style="width:${pct}%;background:${color}"></div></div>
  ${c.faltante?`<div class="dashnote" style="margin-top:3px">${esc(c.faltante)}</div>`:""}
  ${extraBits.length?`<div class="dashnote" style="margin-top:2px">${extraBits.map(t=>esc(t)).join(" · ")}</div>`:""}</div>`;
 }).join("");
 let mudoList=ev.controles.filter(c=>c.state==="MUDO");
 let historyRows=weeks6.map(w=>{let e=matrix[a.id][w];return `<tr><td>${esc(weekLabel(w))}${isCurrentWeek(w)?" · en curso":""}</td><td>${estatusBadge(e.estatus)}</td><td>${e.cumplimientoPct}%</td></tr>`}).join("");
 let dayNames=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
 let dayCells=cons.dayFlags.map((d,i)=>`<div class="daycell ${d.captured?"day-yes":"day-no"}">${dayNames[i]}<br>${d.captured?"✅":"—"}</div>`).join("");
 let indicacion=ejecIndicacionTexto(a,ev,matrix,formType,wk,weeks6);
 let tazTasaTxt=formType==="Banco"?(ev.tasaActivacionTaz!=null?`${Math.round(ev.tasaActivacionTaz*100)}%${ev.tasaActivacionTaz<TASA_ACTIVACION_MIN?" ⚠️":""}`:"—"):null;
 return `
 <div class="chartcard"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
  <div><h2 style="margin:0 0 4px">${esc(a.name)}</h2><div class="dashnote">N.º empleado ${esc(a.emp)} · ${esc(a.branch)} · ${esc(a.puesto||"Sin puesto asignado")}</div></div>${estatusBadge(ev.estatus)}</div>
  <div class="kpigrid" style="margin-top:16px">${kpiCard("Cumplimiento",ev.cumplimientoPct+"%")}${kpiCard("Constancia",`${cons.diasConCaptura}/7`,cons.focoRojo?"🔴 Foco rojo":"")}${tazTasaTxt!==null?kpiCard("Activación TAZ",tazTasaTxt):""}${kpiCard("Rubros en mudo",mudoList.length)}</div>
  ${mudoList.length?`<div class="notice" style="margin-top:14px">🔴 <b>En mudo:</b> ${mudoList.map(c=>esc(c.label)).join(", ")}.</div>`:`<div class="notice" style="margin-top:14px">🟢 Sin mudos esta semana.</div>`}
 </div>
 <div class="chartcard"><h3>Avance por control — ${esc(weekLabel(wk))}</h3>${progressRows}</div>
 <div class="chartcard"><h3>Constancia por día</h3><div class="chartsub">Días con al menos una captura, lunes a domingo.${cons.focoRojo?' <b style="color:var(--red)">🔴 Foco rojo de constancia.</b>':""}</div><div class="daygrid">${dayCells}</div></div>
 <div class="chartcard"><h3>Historial — últimas 6 semanas</h3><div class="tablewrap"><table><thead><tr><th>Semana</th><th>Estatus</th><th>Cumplimiento</th></tr></thead><tbody>${historyRows}</tbody></table></div></div>
 <div class="chartcard"><h3>📋 Indicación sugerida</h3><div class="indicrow"><div>${esc(indicacion)}</div><button class="btn secondary" onclick='ejecCopyText(this,${JSON.stringify(indicacion)})'>Copiar</button></div></div>`;
}
function placeholder(title,sub,icon,msg){topTitle.textContent=title;view.innerHTML=`<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div></div><div class="card placeholder"><div><div class="icon">${icon}</div><h2>${title}</h2><p>${msg}</p></div></div>`}
function renderAdminAsesoresTab(){document.getElementById("adminTabBody").innerHTML=`<div class="pagehead"><div><span class="sectionmark">GRUPO ELEKTRA · BANCO AZTECA</span><h2 style="margin:6px 0 4px">Asesores</h2><p>Administra los asesores de las 11 sucursales de la región. <b><span id="advisorCount"></span> asesores cargados.</b></p></div><button class="btn primary" onclick="openModal()">+ Nuevo asesor</button></div><div class="card"><div class="filters"><input id="q" placeholder="Buscar por nombre o número de empleado" oninput="drawRows()"><select id="fb" onchange="drawRows()"><option value="">Todas las sucursales</option>${branches.map(x=>`<option>${x}</option>`).join("")}</select><select id="fs" onchange="drawRows()"><option value="">Todas las actividades</option><option>Activo</option><option>Vacaciones</option><option>Incapacidad</option></select></div><div id="rows"></div></div>`;document.getElementById("advisorCount").textContent=advisors.filter(x=>x.status!=="Baja").length;drawRows()}
function drawRows(){let q=(document.getElementById("q")?.value||"").toLowerCase(),fb=document.getElementById("fb")?.value||"",fs=document.getElementById("fs")?.value||"";let a=advisors.filter(x=>x.status!=="Baja"&&(x.name.toLowerCase().includes(q)||x.emp.includes(q))&&(!fb||x.branch===fb)&&(!fs||x.status===fs));document.getElementById("rows").innerHTML=a.length?`<table><thead><tr><th>N.º empleado</th><th>Nombre</th><th>Puesto</th><th>Sucursal</th><th>Actividad</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.emp)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.puesto||"Sin puesto asignado")}</td><td>${esc(x.branch)}</td><td><span class="badge ${x.status.toLowerCase()}">${x.status}</span></td><td><button class="linkbtn" onclick="openModal('${esc(x.id)}')">Editar</button></td></tr>`).join("")}</tbody></table>`:`<div style="padding:36px;text-align:center;color:#6f7b91">No hay asesores para mostrar. Usa <b>+ Nuevo asesor</b> para comenzar.</div>`}
// ADMIN-ONLY: dar de baja / cambiar estatus — proteger cuando se agregue el login.
function deactivateAdvisor(id){
 const a=advisors.find(x=>x.id===id); if(!a)return;
 if(!confirm(`¿Dar de baja a ${a.name}?\n\nEl asesor dejará de estar disponible para nuevas capturas. Su información e historial se conservarán.`))return;
 a.status="Baja"; a.deactivated_at=new Date().toISOString(); a.deactivated_by="Administrador"; a.updated_at=new Date().toISOString();
 localStorage.setItem("crm_advisors",JSON.stringify(advisors)); drawRows();
}
// ADMIN-ONLY: reactivar / cambiar estatus — proteger cuando se agregue el login.
function reactivateAdvisor(id){
 const a=advisors.find(x=>x.id===id); if(!a)return;
 if(!confirm(`¿Reactivar a ${a.name}?\n\nSu actividad volverá a Activo.`))return;
 a.status="Activo"; a.reactivated_at=new Date().toISOString(); a.reactivated_by="Administrador"; a.updated_at=new Date().toISOString();
 localStorage.setItem("crm_advisors",JSON.stringify(advisors)); drawRows();
}
function openModal(id){editing=id||null;document.getElementById("branch").innerHTML=branches.map(x=>`<option>${x}</option>`).join("");document.getElementById("puesto").innerHTML=`<option value="">Sin puesto asignado</option>`+PUESTOS_ALL.map(p=>`<option>${esc(p)}</option>`).join("");document.getElementById("modalTitle").textContent=editing?"Editar asesor":"Nuevo asesor";let a=advisors.find(x=>x.id===editing);document.getElementById("emp").value=a?.emp||"";document.getElementById("name").value=a?.name||"";document.getElementById("branch").value=a?.branch||branches[0];document.getElementById("status").value=a?.status||"Activo";document.getElementById("puesto").value=a?.puesto||"";document.getElementById("error").textContent="";document.getElementById("modalbg").classList.add("open")}
function closeModal(){document.getElementById("modalbg").classList.remove("open")}
// ADMIN-ONLY: alta / edición / cambio de estatus de asesor — proteger cuando se agregue el login.
function saveAdvisor(){let emp=document.getElementById("emp").value.trim(),name=document.getElementById("name").value.trim(),branch=document.getElementById("branch").value,status=document.getElementById("status").value,puesto=document.getElementById("puesto").value,err=document.getElementById("error");if(!/^\d+$/.test(emp)||!name){err.textContent="Captura un número de empleado válido y el nombre completo.";return}if(!editing&&!puesto){err.textContent="Selecciona un puesto para el nuevo asesor.";return}if(editing){let i=advisors.findIndex(x=>x.id===editing);advisors[i]={...advisors[i],emp,name,branch,status,puesto,updated_at:new Date().toISOString()}}else advisors.push({id:genAdvisorId(),emp,name,branch,status,puesto,created_at:new Date().toISOString(),updated_at:new Date().toISOString()});localStorage.setItem("crm_advisors",JSON.stringify(advisors));closeModal();renderAdminAsesoresTab()}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>nav(b.dataset.page));nav("avance");
</script>
</body></html>
